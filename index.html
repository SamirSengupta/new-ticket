<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="color.css" />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background-color: #3b7ac1;
      /* ensure no white behind notch */
    }

    .header {
      background-color: #3b7ac1;
      height: calc(18rem + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      border-bottom-left-radius: 15px;
      border-bottom-right-radius: 15px;
      position: relative;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .color-strip {
      display: flex;
      justify-content: space-between;
      width: 70%;
      animation: blinker 1s linear infinite;
      height: 40px;
      margin-bottom: 20px;
      margin-top: 20px;
      position: relative;
      top: 120px;
    }

    .strip-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 95%;
      position: relative;
      top: 20px;
      margin-bottom: 20px;
      margin-top: 20px;
    }

    .color-strip {
      width: 100%;
      top: 0;
      margin: 0;
    }

    .progress-bar-container {
      width: 100%;
      height: 5px;
      background-color: #e0e0e0;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #2196F3;
      border-radius: 3px;
      transition: width 1s linear;
    }

    @keyframes blinker {

      0%,
      49% {
        opacity: 0;
      }

      50%,
      100% {
        opacity: 1;
      }
    }

    .color-block {
      width: 80%;
      height: 20px;
    }

    .red {
      background: var(--stripone);
    }

    .green {
      background: var(--striptwo);
    }

    .blue {
      background: var(--stripthree);
    }

    .qr-container {
      background: var(--first);
    }
  </style>
</head>

<body class="bg-[#e8e8e8] flex justify-center">
  <div class="w-full max-w-md min-h-screen bg-[#e8e8e8] relative">

    <!-- Top Blue Header -->
    <div class="header">
      <!-- Title Row with Back Arrow -->
      <div class="flex items-center justify-center relative pt-[20px]">
        <div class="absolute left-4 text-white text-2xl cursor-pointer">
          ‹
        </div>
        <h1 class="text-white text-base font-bold text-center">
          One Way Ticket
        </h1>
      </div>
    </div>

    <!-- White Card -->
    <div class="
      bg-white 
      w-[90%] 
      min-h-[75vh]
      mx-auto 
      -mt-[230px]
      rounded-[15px]
      shadow-[0_20px_40px_rgba(0,0,0,0.15)]
      relative
      z-10
      p-8
      flex
      flex-col
      items-center
    ">
      <!-- QR Code -->
      <div class="qr-container rounded-xl p-4 -mt-2">
        <img src="qr.png" alt="QR Code" class="w-[142px] h-[142px]" />
      </div>

      <p class="text-gray-600 text-sm -mt-[2px]">Tap to enlarge</p>

      <!-- Dashed Line -->
      <div class="w-full border-t-2 border-dashed border-gray-300 mt-[5px] mb-6"></div>

      <!-- Ticket Info -->
      <h2 class="text-4xl font-bold tracking-tight mb-2 cursor-pointer" id="stateType" onclick="toggleState()">
        INTRASTATE</h2>
      <div class="text-6xl font-bold my-4 cursor-pointer" id="zoneNumber" onclick="cycleZone()">1</div>
      <h3 class="text-lg font-semibold mb-2">ZONE RIDE</h3>
      <h3 class="text-lg font-semibold mb-2">1 Adult</h3>

      <script>
        // Toggle between INTRASTATE and INTERSTATE
        let isIntrastate = true;
        function toggleState() {
          const stateEl = document.getElementById('stateType');
          isIntrastate = !isIntrastate;
          if (isIntrastate) {
            stateEl.textContent = 'INTRASTATE';
            stateEl.style.color = 'black';
          } else {
            stateEl.textContent = 'INTERSTATE';
            stateEl.style.color = '#e53935';
          }
        }

        // Cycle zone number 1 → 2 → 3 → 1
        let currentZone = 1;
        function cycleZone() {
          currentZone = currentZone >= 3 ? 1 : currentZone + 1;
          document.getElementById('zoneNumber').textContent = currentZone;
          // Reset timer based on zone
          if (currentZone === 3) {
            initialSeconds = 60 * 60; // 1 hour for zone 3
          } else {
            initialSeconds = 30 * 60; // 30 minutes for zones 1-2
          }
          totalSeconds = initialSeconds;
          document.getElementById('progressBar').style.width = '0%';
        }
      </script>

      <!-- Color Strip and Progress Bar -->
      <div class="strip-container">
        <div class="color-strip">
          <div class="color-block red"></div>
          <div class="color-block green"></div>
          <div class="color-block blue"></div>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
      </div>

      <!-- Timer -->
      <h3 class="text-2xl font-bold mb-4 mt-[40px]" id="timer">Expires in 30:00</h3>

      <script>
        let initialSeconds = 30 * 60; // 30 minutes in seconds
        let totalSeconds = initialSeconds;

        function updateTimer() {
          const minutes = Math.floor(totalSeconds / 60);
          const seconds = totalSeconds % 60;
          const formattedTime = `${minutes}:${seconds.toString().padStart(2, '0')}`;
          document.getElementById('timer').textContent = `Expires in ${formattedTime}`;

          // Update progress bar - fills as time decreases
          const progressPercent = ((initialSeconds - totalSeconds) / initialSeconds) * 100;
          document.getElementById('progressBar').style.width = progressPercent + '%';

          if (totalSeconds > 0) totalSeconds--;
          else document.getElementById('timer').textContent = 'Expired';
        }

        updateTimer();
        setInterval(updateTimer, 1000);
      </script>

      <!-- Link -->
      <a href="#" class="text-[15px] underline mt-auto -mb-[25px]">View Onboard Validator Instructions</a>
    </div>
  </div>
</body>

</html>
