<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#e8e8e8] flex justify-center">

  <div class="w-full max-w-md min-h-screen bg-[#e8e8e8] relative">

    <!-- Top Blue Header -->
    <div class="bg-[#3B82F6] h-60 rounded-b-[15px] relative shadow-lg">
      <!-- Back Arrow -->
      <div class="absolute left-4 top-10 text-white text-3xl cursor-pointer">
        ←
      </div>

      <!-- Title -->
      <h1 class="text-white text-2xl font-bold text-center pt-10">
        One Way Ticket
      </h1>
    </div>

    <!-- White Card with Large Radius -->
    <div class="
      bg-white 
      w-[90%] 
      min-h-[80vh]
      mx-auto 
      -mt-40
      rounded-[15px]
      shadow-[0_20px_40px_rgba(0,0,0,0.15)]
      relative
      z-10
    ">
      <!-- Content goes here -->
    </div>

  </div>

</body>
</html>
