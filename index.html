<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

<title>One Way Ticket</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
    body {
        margin: 0;
        background: url("./background.png") no-repeat top center;
        background-size: 100% auto;
        overflow-x: hidden;
    }

    /* Root container scaled from 620px design */
    #cardRoot {
        width: 620px;
        height: 708px;
        position: absolute;
        left: 50%;
        transform-origin: top;
        transform: translateX(-50%) scale(var(--card-scale));
    }

    /* Absolute positioned children—design ONCE at 620×708 */
    .abs {
        position: absolute;
    }
</style>

<script>
    function scaleCard() {
        const designWidth = 620;  // Your perfect layout width
        const screenWidth = window.innerWidth;
        const scale = screenWidth / designWidth;
        document.documentElement.style.setProperty('--card-scale', scale);
    }

    window.addEventListener("load", scaleCard);
    window.addEventListener("resize", scaleCard);
</script>
</head>


<body>

<!-- The scaled card overlay sitting inside background.png -->
<div id="cardRoot" style="top: 140px;"> <!-- adjust top until card matches background.png -->

    <!-- QR CODE -->
    <div class="abs" style="left: 205px; top: -20px;">
        <div style="padding: 12px; background:#D7A3EA; border-radius: 18px;">
            <img src="./qr.png" width="210" height="210" style="border-radius: 12px;" />
        </div>
    </div>

    <!-- Tap To Enlarge -->
    <p class="abs text-gray-600" style="top: 210px; width: 100%; text-align:center; font-size: 20px; font-weight: 500;">
        Tap to enlarge
    </p>


    <!-- Divider -->
    <div class="abs" style="top: 242px; width: 100%;">
        <div style="width: 90%; margin: 0 auto; border-top: 1px solid #CCC;"></div>
    </div>

    <!-- INTRASTATE -->
    <p class="abs font-bold" style="top: 320px; width: 100%; text-align:center; font-size: 26px;">
        INTRASTATE
    </p>

    <!-- 1 -->
    <p class="abs font-extrabold" style="top: 360px; width: 100%; text-align:center; font-size: 80px; line-height: 80px;">
        1
    </p>

    <!-- ZONE RIDE -->
    <p class="abs font-semibold" style="top: 445px; width: 100%; text-align:center; font-size: 20px;">
        ZONE RIDE
    </p>

    <!-- 1 Child -->
    <p class="abs" style="top: 475px; width: 100%; text-align:center; font-size: 17px;">
        1 Child*
    </p>

    <!-- Gradient Bar -->
    <div class="abs" style="top: 520px; width: 100%; text-align:center;">
        <div style="
            width: 90%; 
            height: 14px;
            margin: 0 auto;
            border-radius: 10px;
            background: linear-gradient(to right, #5E2CE6 25%, #C43CFF 60%, #FF4CF5 100%);
        "></div>
    </div>

    <!-- Secondary gray track -->
    <div class="abs" style="top: 545px; width: 100%;">
        <div style="width: 88%; height: 5px; margin: 0 auto; background: #d0d0d0; border-radius: 8px;"></div>
    </div>

    <!-- Expires in 29:56 -->
    <p class="abs font-bold" style="top: 580px; width: 100%; text-align:center; font-size: 26px;">
        Expires in 29:56
    </p>

    <!-- View instructions -->
    <p class="abs underline" style="top: 620px; width: 100%; text-align:center; font-size: 14px;">
        View Onboard Validator Instructions
    </p>

</div>

</body>
</html>
